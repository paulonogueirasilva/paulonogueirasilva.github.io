<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu GitHub Pages</title>
    <style>
        /* Remove as margens padrão do navegador e garante que o body ocupe a tela toda */
        body {
            margin: 0;
            height: 100vh; /* 100% da altura da tela (Viewport Height) */
            display: flex;
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center;     /* Centraliza verticalmente */
            text-align: center;      /* Garante que o texto quebre linhas centralizado, se necessário */
            font-family: sans-serif; /* Apenas um toque estético para o texto não ficar com a fonte padrão */
            background-color: #f4f4f9; /* Opcional: um fundo sutil para dar destaque */
        }

        h1 {
            max-width: 80%; /* Evita que o texto encoste nas bordas em telas menores */
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Salve, salve! Esta página está em manutenção! Em breve, novidades.</h1>
</body>
</html>
